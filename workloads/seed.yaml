database:
  kind: postgres
  dsn: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

init_schema: true

scheduling:
  clients: 1
  duration: "1s"
  barrier_every: 0
  random_kill_pct: 0

workload:
  datatype: register
  mix:
    - txn: seed
      weight: 1

  transactions:
    - name: seed
      isolation: "READ COMMITTED"
      timeout: "5s"
      steps:
        - sql: "DROP TABLE IF EXISTS kv"
        - sql: |
            CREATE TABLE kv (
              k INT PRIMARY KEY,
              v BIGINT NOT NULL DEFAULT 0
            )
        - sql: "INSERT INTO kv (k, v) VALUES (1, 0)"
        - sql: "INSERT INTO kv (k, v) VALUES (2, 0)"
        - sql: "INSERT INTO kv (k, v) VALUES (3, 0)"
        - sql: "INSERT INTO kv (k, v) VALUES (4, 0)"
