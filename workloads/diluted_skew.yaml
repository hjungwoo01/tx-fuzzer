database:
  kind: postgres
  dsn: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

init_schema: true
consistency_model: serializable

workload:
  datatype: register
  transactions:
    - name: safe_read
      isolation: "READ COMMITTED"
      timeout: "2s"
      steps:
        - sql: "SELECT v FROM kv WHERE k = $1"
          args:
            - choice: {from: [1, 10000]}
          elle: {f: ":read", key: "$1", value_from_result_col: 0}

    - name: safe_write
      isolation: "READ COMMITTED"
      timeout: "2s"
      steps:
        - sql: "UPDATE kv SET v = $1 WHERE k = $2"
          args:
            - now_ns: {}
            - choice: {from: [1, 10000]}
          elle: {f: ":write", key: "$2"}

    - name: skew_a
      isolation: "READ COMMITTED"
      timeout: "2s"
      inter_query_delay_ms: 10
      steps:
        - sql: "SELECT v FROM kv WHERE k = $1"
          args:
            - choice: {from: [1, 10000]}
          elle: {f: ":read", key: "$1", value_from_result_col: 0}
        - sql: "SELECT v FROM kv WHERE k = $2"
          args:
            - choice: {from: [1, 10000]}
          elle: {f: ":read", key: "$2", value_from_result_col: 0}
        - sleep: "50ms"
        - sql: "UPDATE kv SET v = $3 WHERE k = $2"
          args:
            - now_ns: {}
          elle: {f: ":write", key: "$2"}

    - name: skew_b
      isolation: "READ COMMITTED"
      timeout: "2s"
      inter_query_delay_ms: 10
      steps:
        - sql: "SELECT v FROM kv WHERE k = $1"
          args:
            - choice: {from: [1, 10000]}
          elle: {f: ":read", key: "$1", value_from_result_col: 0}
        - sql: "SELECT v FROM kv WHERE k = $2"
          args:
            - choice: {from: [1, 10000]}
          elle: {f: ":read", key: "$2", value_from_result_col: 0}
        - sleep: "50ms"
        - sql: "UPDATE kv SET v = $3 WHERE k = $2"
          args:
            - now_ns: {}
          elle: {f: ":write", key: "$2"}

  mix:
    - txn: safe_read
      weight: 0.45
    - txn: safe_write
      weight: 0.45
    - txn: skew_a
      weight: 0.05
    - txn: skew_b
      weight: 0.05

scheduling:
  duration: "5s"
  clients: 4
  barrier_every: 0
  random_kill_pct: 0
  jitter_ms_min: 0
  jitter_ms_max: 0
