database:
  kind: postgres
  dsn: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

init_schema: true

workload:
  datatype: register
  transactions:
    - name: rr-conflict
      isolation: "REPEATABLE READ"
      timeout: "2s"
      inter_query_delay_ms: 50
      steps:
        - sql: "SELECT v FROM kv WHERE k=$1"
          args: [1]
          elle: {f: ":read", key: "$1", value_from_result_col: 0}
        - sql: "UPDATE kv SET v=$1 WHERE k=$2"
          args:
            - now_ns: {}
            - 1
          elle: {f: ":write", key: "$2"}

  mix:
    - txn: rr-conflict
      weight: 1

scheduling:
  duration: "2s"
  clients: 2
  barrier_every: 1
  random_kill_pct: 0
  jitter_ms_min: 0
  jitter_ms_max: 0
