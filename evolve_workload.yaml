database:
  kind: postgres
  dsn: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

init_schema: true

workload:
  datatype: register
  transactions:
    - name: read-two
      isolation: "READ COMMITTED"
      timeout: "2s"
      steps:
        - sql: "SELECT v FROM kv WHERE k=$1"
          args: [{rand_int: {min: 1, max: 12}}]
          elle: {f: ":read", key: "$1", value_from_result_col: 0}
        - sql: "SELECT v FROM kv WHERE k=$1"
          args: [{rand_int: {min: 1, max: 12}}]
          elle: {f: ":read", key: "$1", value_from_result_col: 0}

    - name: write-one
      isolation: "READ COMMITTED"
      timeout: "2s"
      steps:
        - sql: "UPDATE kv SET v=$1 WHERE k=$2"
          args:
            - tx_write_id: {}
            - rand_int: {min: 1, max: 12}
          elle: {f: ":write", key: "$2"}
        - sql: "SELECT v FROM kv WHERE k=$1"
          args: ["$2"]
          elle: {f: ":read", key: "$1", value_from_result_col: 0}

    - name: read-modify-write
      isolation: "READ COMMITTED"
      timeout: "2s"
      steps:
        - sql: "SELECT v FROM kv WHERE k=$1"
          args: [{rand_int: {min: 1, max: 12}}]
          elle: {f: ":read", key: "$1", value_from_result_col: 0}
        - sql: "UPDATE kv SET v=$1 WHERE k=$2"
          args:
            - tx_write_id: {}
            - "$1"
          elle: {f: ":write", key: "$2"}
        - sql: "SELECT v FROM kv WHERE k=$1"
          args: ["$2"]
          elle: {f: ":read", key: "$1", value_from_result_col: 0}

    - name: blind-write
      isolation: "READ COMMITTED"
      timeout: "2s"
      steps:
        - sql: "UPDATE kv SET v=$1 WHERE k=$2"
          args:
            - tx_write_id: {}
            - rand_int: {min: 1, max: 12}
          elle: {f: ":write", key: "$2"}
        - sql: "UPDATE kv SET v=$1 WHERE k=$2"
          args:
            - tx_write_id: {}
            - rand_int: {min: 1, max: 12}
          elle: {f: ":write", key: "$2"}

  mix:
    - txn: read-two
      weight: 0.20
    - txn: write-one
      weight: 0.30
    - txn: read-modify-write
      weight: 0.30
    - txn: blind-write
      weight: 0.20

scheduling:
  duration: "8s"
  clients: 4
  barrier_every: 0
  random_kill_pct: 0
  jitter_ms_min: 0
  jitter_ms_max: 0
