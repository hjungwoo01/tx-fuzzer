# Long evaluation suite — thorough experiments with 5 repetitions
# Designed for overnight / extended runs
# Run: python scripts/experiments/run_suite.py --config experiments/postgres_long.yaml
# Smoke: python scripts/experiments/run_suite.py --config experiments/postgres_long.yaml --smoke

base_seed: 42
repetitions: 5

experiments:
  # ══════════════════════════════════════════════════════════════════
  # (1) SSI update-conflict-out: 12.3 (vulnerable) — full treatment
  # ══════════════════════════════════════════════════════════════════
  - workload: update_conflict_out
    variants: ["update", "delete"]
    isolation_levels: ["SERIALIZABLE"]
    pg_versions: ["12.3"]
    fixed_dsn: "postgres://postgres:postgres@localhost:54324/postgres?sslmode=disable"
    replay_count: 5
    strategies:
      - name: baseline_no_delays
        trials: 1000
      - name: random_delays
        trials: 1000
        k: 3
      - name: heuristic_fuzzer
        budget: 5000
        k: 3
      # Ablation: no commit_hold
      - name: heuristic_no_commit_hold
        budget: 5000
        k: 3
        disable_commit_hold: true
      # Ablation: only commit_hold + fallback (no key-based tiers)
      - name: heuristic_no_key_tiers
        budget: 5000
        k: 3
        disable_key_tiers: true
      # K sweep
      - name: heuristic_k1
        budget: 2000
        k: 1
      - name: heuristic_k2
        budget: 2000
        k: 2
      - name: heuristic_k3
        budget: 2000
        k: 3
      # Budget sweep (at k=3)
      - name: heuristic_budget_500
        budget: 500
        k: 3
      - name: heuristic_budget_1000
        budget: 1000
        k: 3
      - name: heuristic_budget_2000
        budget: 2000
        k: 3

  # ── (1b) SSI update-conflict-out: 12.4 (fixed control) ──
  - workload: update_conflict_out
    variants: ["update"]
    isolation_levels: ["SERIALIZABLE"]
    pg_versions: ["12.4"]
    replay_count: 5
    strategies:
      - name: baseline_no_delays
        trials: 500
      - name: heuristic_fuzzer
        budget: 1000
        k: 3

  # ══════════════════════════════════════════════════════════════════
  # (2) Write skew (doctors) — full treatment
  # ══════════════════════════════════════════════════════════════════
  - workload: doctors_write_skew
    variants: ["buggy"]
    isolation_levels: ["REPEATABLE READ", "SERIALIZABLE"]
    pg_versions: ["16.2"]
    replay_count: 5
    strategies:
      - name: baseline_no_delays
        trials: 1000
      - name: random_delays
        trials: 1000
        k: 3
      - name: heuristic_fuzzer
        budget: 5000
        k: 3
      - name: heuristic_no_commit_hold
        budget: 5000
        k: 3
        disable_commit_hold: true
      - name: heuristic_k1
        budget: 2000
        k: 1
      - name: heuristic_k2
        budget: 2000
        k: 2
      - name: heuristic_k3
        budget: 2000
        k: 3

  - workload: doctors_write_skew
    variants: ["fixed"]
    isolation_levels: ["REPEATABLE READ"]
    pg_versions: ["16.2"]
    replay_count: 5
    strategies:
      - name: baseline_no_delays
        trials: 500
      - name: heuristic_fuzzer
        budget: 1000
        k: 3

  # fixed_ordered_locks: consistent lock ordering, no deadlocks
  - workload: doctors_write_skew
    variants: ["fixed_ordered_locks"]
    isolation_levels: ["REPEATABLE READ"]
    pg_versions: ["16.2"]
    replay_count: 5
    strategies:
      - name: baseline_no_delays
        trials: 500
      - name: heuristic_fuzzer
        budget: 1000
        k: 3

