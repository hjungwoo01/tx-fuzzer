# Quick evaluation suite v3 — publishable-quality
# Runs in ~10-20 minutes
# Repetitions: 3 per experiment for statistical significance
# Includes: K sweep, budget sweep, ablations on all 3 headline workloads;
#           sanity checks with minimal runs

base_seed: 42
repetitions: 3

experiments:
  # ══════════════════════════════════════════════════════════════════
  # HEADLINE WORKLOAD 1: SSI update-conflict-out (PG 12.3 → 12.4)
  # ══════════════════════════════════════════════════════════════════

  # ── (1a) 12.3 vulnerable: full strategy matrix ──
  - workload: update_conflict_out
    variants: ["update"]
    isolation_levels: ["SERIALIZABLE"]
    pg_versions: ["12.3"]
    fixed_dsn: "postgres://postgres:postgres@localhost:54324/postgres?sslmode=disable"
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 100
      - name: random_delays
        trials: 100
        k: 3
      - name: heuristic_fuzzer
        budget: 200
        k: 3
      # Ablation: no commit_hold
      - name: heuristic_no_commit_hold
        budget: 200
        k: 3
        disable_commit_hold: true
      # Ablation: no key tiers
      - name: heuristic_no_key_tiers
        budget: 200
        k: 3
        disable_key_tiers: true
      # K sweep (negative controls)
      - name: heuristic_k1
        budget: 200
        k: 1
      - name: heuristic_k2
        budget: 200
        k: 2

  # ── (1b) 12.4 fixed: negative control ──
  - workload: update_conflict_out
    variants: ["update"]
    isolation_levels: ["SERIALIZABLE"]
    pg_versions: ["12.4"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 50
      - name: heuristic_fuzzer
        budget: 100
        k: 3

  # ══════════════════════════════════════════════════════════════════
  # HEADLINE WORKLOAD 2: Job-queue double claim (PG 16.2)
  # ══════════════════════════════════════════════════════════════════

  # ── (2a) Buggy: full strategy matrix + K sweep + ablation ──
  - workload: job_queue_double_claim
    variants: ["buggy"]
    isolation_levels: ["READ COMMITTED"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 100
      - name: random_delays
        trials: 100
        k: 3
      - name: heuristic_fuzzer
        budget: 200
        k: 3
      # Ablation: no commit_hold
      - name: heuristic_no_commit_hold
        budget: 200
        k: 3
        disable_commit_hold: true
      # K sweep
      - name: heuristic_k1
        budget: 200
        k: 1
      - name: heuristic_k2
        budget: 200
        k: 2

  # ── (2b) Fixed variant: negative control ──
  - workload: job_queue_double_claim
    variants: ["fixed"]
    isolation_levels: ["READ COMMITTED"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 50
      - name: heuristic_fuzzer
        budget: 100
        k: 3

  # ══════════════════════════════════════════════════════════════════
  # HEADLINE WORKLOAD 3: Bank overdraft (PG 16.2) — NEW
  # ══════════════════════════════════════════════════════════════════

  # ── (3a) Buggy: full strategy matrix + K sweep + ablation ──
  - workload: bank_overdraft
    variants: ["buggy"]
    isolation_levels: ["READ COMMITTED"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 100
      - name: random_delays
        trials: 100
        k: 3
      - name: heuristic_fuzzer
        budget: 200
        k: 3
      # Ablation: no commit_hold
      - name: heuristic_no_commit_hold
        budget: 200
        k: 3
        disable_commit_hold: true
      # K sweep
      - name: heuristic_k1
        budget: 200
        k: 1
      - name: heuristic_k2
        budget: 200
        k: 2

  # ── (3b) Fixed variant: negative control ──
  - workload: bank_overdraft
    variants: ["fixed"]
    isolation_levels: ["READ COMMITTED"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 50
      - name: heuristic_fuzzer
        budget: 100
        k: 3

  # ══════════════════════════════════════════════════════════════════
  # SANITY WORKLOADS — baseline + heuristic only, confirm direction
  # ══════════════════════════════════════════════════════════════════

  # ── (4) Write skew (doctors) RR ──
  - workload: doctors_write_skew
    variants: ["buggy"]
    isolation_levels: ["REPEATABLE READ"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 100
      - name: random_delays
        trials: 100
        k: 3
      - name: heuristic_fuzzer
        budget: 200
        k: 3

  # ── (4b) Write skew SERIALIZABLE — expect 40001 ──
  - workload: doctors_write_skew
    variants: ["buggy"]
    isolation_levels: ["SERIALIZABLE"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 50
      - name: heuristic_fuzzer
        budget: 100
        k: 3

  # ── (4c) Write skew fixed (naive FOR UPDATE, high deadlock rate) — reference ──
  - workload: doctors_write_skew
    variants: ["fixed"]
    isolation_levels: ["REPEATABLE READ"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 50
      - name: heuristic_fuzzer
        budget: 100
        k: 3

  # ── (4d) Write skew fixed_ordered_locks — no deadlocks, no bugs ──
  - workload: doctors_write_skew
    variants: ["fixed_ordered_locks"]
    isolation_levels: ["REPEATABLE READ"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 100
      - name: heuristic_fuzzer
        budget: 200
        k: 3

  # ── (5) Bank lost update ──
  - workload: bank_lost_update
    variants: ["buggy"]
    isolation_levels: ["READ COMMITTED"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 100
      - name: random_delays
        trials: 100
        k: 3
      - name: heuristic_fuzzer
        budget: 200
        k: 3

  # ── (5b) Bank lost update fixed ──
  - workload: bank_lost_update
    variants: ["fixed"]
    isolation_levels: ["READ COMMITTED"]
    pg_versions: ["16.2"]
    replay_count: 3
    strategies:
      - name: baseline_no_delays
        trials: 50
      - name: heuristic_fuzzer
        budget: 100
        k: 3

  # ── (6) Inventory oversell ──
  - workload: inventory_oversell
    variants: ["buggy"]
    isolation_levels: ["READ COMMITTED"]
    pg_versions: ["16.2"]
    replay_count: 3
