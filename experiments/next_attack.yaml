database:
  kind: postgres
  dsn: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
workload:
  datatype: register
  transactions:
  - name: p1_fixed
    isolation: READ COMMITTED
    timeout: 2s
    steps:
    - sql: SELECT v FROM kv WHERE k = $1
      args:
      - 432
      elle:
        f: :read
        key: $1
        value_from_result_col: 0
    - sleep: 10ms
    - sql: UPDATE kv SET v = 999 WHERE k = $1
      args:
      - 432
      elle:
        f: :write
        key: $1
  - name: p2_fixed
    isolation: READ COMMITTED
    timeout: 2s
    steps:
    - sql: SELECT v FROM kv WHERE k = $1
      args:
      - 432
      elle:
        f: :read
        key: $1
        value_from_result_col: 0
    - sleep: 10ms
    - sql: UPDATE kv SET v = 999 WHERE k = $1
      args:
      - 432
      elle:
        f: :write
        key: $1
scheduling:
  duration: 1s
  clients: 2
replay:
  enabled: true
  transactions:
  - alias: P1
    txn: p1_fixed
    process: 0
  - alias: P2
    txn: p2_fixed
    process: 1
  schedule:
  - alias: P1
    action: step
    steps: 1
  - alias: P2
    action: step
    steps: 1
  - alias: P2
    action: step
    steps: 2
  - alias: P1
    action: step
    steps: 2
  - alias: P1
    action: commit
  - alias: P2
    action: commit
