# Docker Compose for SSI update-conflict-out bug reproduction.
# Runs postgres:12.3 (vulnerable) and postgres:12.4 (fixed) side by side.
#
# Start:  docker compose -f docker-compose-repro.yml up -d
# Stop:   docker compose -f docker-compose-repro.yml down -v
# Status: docker compose -f docker-compose-repro.yml ps

services:
  postgres12_3:
    image: postgres:12.3
    container_name: pg-repro-12-3
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54323:5432"
    command:
      - "postgres"
      - "-c" 
      - "synchronous_commit=off"
      - "-c"
      - "fsync=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "autovacuum=off"
      - "-c"
      - "max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  postgres12_4:
    image: postgres:12.4
    container_name: pg-repro-12-4
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54324:5432"
    command:
      - "postgres"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "fsync=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "autovacuum=off"
      - "-c"
      - "max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
